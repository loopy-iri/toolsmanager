services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - toolmanager_data:/app/server/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  toolmanager_data:
